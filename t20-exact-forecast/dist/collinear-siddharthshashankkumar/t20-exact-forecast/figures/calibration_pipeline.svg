<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Calibrate the setting; expose the assumptions.</title><desc id="desc">Keep observations, design choices and validation separate so a good fit is not mistaken for independent evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708497"/></marker></defs>
<rect width="1600" height="960" fill="#F7F9FC"/>
<text x="64" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1.8">COLLINEAR TAKE-HOME  /  ARCHITECTURE 02</text>
<text x="64" y="100" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Calibrate the setting; expose the assumptions.</text>
<text x="64" y="138" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Keep observations, design choices and validation separate so a good fit is not mistaken for independent evidence.</text>
<path d="M64 166 L1536 166" fill="none" stroke="#CFD9E2" stroke-width="1.5"/>
<path d="M64 902 L1536 902" fill="none" stroke="#CFD9E2" stroke-width="1.5"/>
<text x="64" y="931" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">t20-exact-forecast  ·  evaluated runtime v0.1.0</text>
<text x="1536" y="931" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#516477" text-anchor="end" letter-spacing="0">Design rationale and evidence in DECISIONS.md</text>
<rect x="64" y="214" width="344" height="206" rx="14" fill="white" stroke="#CFD9E2" stroke-width="1.4"/>
<rect x="64" y="232" width="4" height="170" rx="2" fill="#16766F" stroke="#16766F" stroke-width="1.4"/>
<text x="88" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1">01 / SOURCE</text>
<text x="88" y="282" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Cricsheet archive</text>
<text x="88" y="317" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">1,243 IPL matches</text>
<text x="88" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">295,557 deliveries</text>
<text x="88" y="371" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Raw archive not shipped</text>
<path d="M408 318 L432 318" fill="none" stroke="#708497" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="440" y="214" width="344" height="206" rx="14" fill="white" stroke="#CFD9E2" stroke-width="1.4"/>
<rect x="440" y="232" width="4" height="170" rx="2" fill="#16766F" stroke="#16766F" stroke-width="1.4"/>
<text x="464" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1">02 / PREPARE</text>
<text x="464" y="282" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Reconstruct the state</text>
<text x="464" y="317" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Legal balls and dismissals</text>
<text x="464" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Score, wickets and chase state</text>
<text x="464" y="371" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">One consistent tabular history</text>
<path d="M784 318 L808 318" fill="none" stroke="#708497" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="816" y="214" width="344" height="206" rx="14" fill="white" stroke="#CFD9E2" stroke-width="1.4"/>
<rect x="816" y="232" width="4" height="170" rx="2" fill="#16766F" stroke="#16766F" stroke-width="1.4"/>
<text x="840" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1">03 / ESTIMATE</text>
<text x="840" y="282" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Measure repeatability</text>
<text x="840" y="317" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Over and situation effects</text>
<text x="840" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Player / venue variation</text>
<text x="840" y="371" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Retain supported structure</text>
<path d="M1160 318 L1184 318" fill="none" stroke="#708497" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1192" y="214" width="344" height="206" rx="14" fill="white" stroke="#CFD9E2" stroke-width="1.4"/>
<rect x="1192" y="232" width="4" height="170" rx="2" fill="#16766F" stroke="#16766F" stroke-width="1.4"/>
<text x="1216" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1">04 / EXPORT</text>
<text x="1216" y="282" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Calibration constants</text>
<text x="1216" y="317" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Aggregate values only</text>
<text x="1216" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Attribution retained</text>
<text x="1216" y="371" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">No real player identities</text>
<rect x="64" y="477" width="708" height="243" rx="18" fill="#EAF5F2" stroke="#EAF5F2" stroke-width="1.4"/>
<text x="88" y="511" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1.1">MEASURED INPUTS</text>
<text x="88" y="552" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Profiles, directions and aggregate variation</text>
<text x="88" y="601" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Derived from the archive and the recorded analysis.</text>
<text x="88" y="642" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Source: league/calibration.json</text>
<rect x="828" y="477" width="708" height="243" rx="18" fill="#FFF6E5" stroke="#FFF6E5" stroke-width="1.4"/>
<text x="852" y="511" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#A36916" text-anchor="start" letter-spacing="1.1">EXPLICIT DESIGN CHOICES</text>
<text x="852" y="552" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Transfers, form drift and simplified rules</text>
<text x="852" y="601" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Chosen or tuned; not all are independently estimated.</text>
<text x="852" y="642" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Source: Design in league/calibration.py</text>
<rect x="64" y="785" width="1472" height="78" rx="12" fill="#FFF6E5" stroke="#F0D5A7" stroke-width="1.4"/>
<text x="88" y="814" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#895610" text-anchor="start" letter-spacing="0">Interpretation matters</text>
<text x="88" y="841" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Matching a target used for tuning is calibration. The league remains a simplified model of cricket.</text>
</svg>