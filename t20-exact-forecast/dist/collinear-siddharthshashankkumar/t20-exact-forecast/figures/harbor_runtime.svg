<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Forecasts return to the privileged grader.</title><desc id="desc">Harbor copies solution and engine artifacts from the agent container into a separate verifier with network disabled. The privileged grader rejects symlinked artifacts before preparing the submitted solution, a pristine engine and eight public-schema league folders. The submitted program runs as user runner and returns CSV forecasts. Those forecasts return to the privileged grader, which alone reads root-only private truth and reference scores. It checks validity, timing, regret, engine integrity and repeatability aligned by fixture identity, then writes reward.json and details.json. No private-score arrow enters the runner. This shows the hardened v0.1.1 submission; historical model trials used v0.1.0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708497"/></marker></defs>
