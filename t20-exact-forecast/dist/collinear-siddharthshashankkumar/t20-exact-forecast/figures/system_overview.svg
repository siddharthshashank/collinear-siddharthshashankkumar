<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">From synthetic history to a scored forecast.</title><desc id="desc">Cricsheet aggregates and explicit design assumptions inform a simulator that generates eight synthetic worlds. One world's public files are visible during agent development; seven more are held out until grading. The submitted forecaster receives each world's public-schema files and returns a forecast CSV. Separately stored probability estimates and reference regrets reach the trusted grader, which validates forecasts and writes reward and detail files. Private scoring data do not enter the submitted program.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708497"/></marker></defs>
<rect width="1600" height="960" fill="#F7F9FC"/>
<text x="64" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1.8">COLLINEAR TAKE-HOME  /  ARCHITECTURE 01</text>
<text x="64" y="100" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">From synthetic history to a scored forecast.</text>
<text x="64" y="138" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">The program receives league files. The trusted grader also receives private scoring data.</text>
