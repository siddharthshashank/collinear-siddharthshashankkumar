schema_version = "1.4"

# Carried from the agent's container into the verifier's: the submitted forecaster, and the engine so the verifier can check it is untouched.
artifacts = ["/app/solution", "/app/engine"]

[task]
name = "collinear-siddharthshashankkumar/t20-exact-forecast"
version = "0.1.1"
description = "Forecast match win probabilities in a synthetic T20 league from ball-by-ball history. Forecasts are graded by expected log loss against stored Monte Carlo probability estimates, on the visible league and seven held-out leagues."
keywords = ["probabilistic forecasting", "statistical inference", "shrinkage", "simulation", "proper scoring rules"]

[[task.authors]]
name = "Siddharth Shashank Kumar"
email = "thesidshashank@gmail.com"

[metadata]
author_name = "Siddharth Shashank Kumar"
author_email = "thesidshashank@gmail.com"
difficulty = "hard"
category = "data_science"
tags = ["python", "forecasting", "statistics", "sports-analytics", "simulation"]
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1500.0
verifier_network_policy = "Docker Compose network_mode: none; Harbor public baseline avoids its unsupported nftables policy switch on some Docker Desktop kernels."

[verifier]
timeout_sec = 10800.0
environment_mode = "separate"

[verifier.environment]
# Actual isolation is enforced by tests/docker-compose.yaml (network_mode: none).
# Harbor 0.23's no-network controller requires kernel features absent on the tested Docker Desktop VM.
network_mode = "public"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[agent]
# generous on purpose: a timeout should never be the cause of a failure
timeout_sec = 10800.0

[environment]
# public only so the agent harness can be installed and can reach its model API. The task needs no network.
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
