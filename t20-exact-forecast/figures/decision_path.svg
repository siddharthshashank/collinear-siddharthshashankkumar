<title id="title">The task choice was an experiment too.</title><desc id="desc">I compared what each candidate would measure, how I could verify it, and whether its difficulty was substantive.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708497"/></marker></defs>
<rect width="1600" height="960" fill="#F7F9FC"/>
<text x="64" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1.8">COLLINEAR TAKE-HOME  /  ARCHITECTURE 07</text>
<text x="64" y="100" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">The task choice was an experiment too.</text>
<text x="64" y="138" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">I compared what each candidate would measure, how I could verify it, and whether its difficulty was substantive.</text>
<path d="M64 166 L1536 166" fill="none" stroke="#CFD9E2" stroke-width="1.5"/>
<path d="M64 902 L1536 902" fill="none" stroke="#CFD9E2" stroke-width="1.5"/>
<text x="64" y="931" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">t20-exact-forecast  ·  evaluated runtime v0.1.0</text>
<text x="1536" y="931" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#516477" text-anchor="end" letter-spacing="0">Design rationale and evidence in DECISIONS.md</text>
<rect x="64" y="229" width="444" height="241" rx="14" fill="white" stroke="#CFD9E2" stroke-width="1.4"/>
<rect x="64" y="247" width="4" height="205" rx="2" fill="#516477" stroke="#516477" stroke-width="1.4"/>
<text x="88" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#516477" text-anchor="start" letter-spacing="1">SET ASIDE / REPORTED EARLIER TRIALS</text>
<text x="88" y="297" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Backtest audit</text>
<text x="88" y="332" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Repair time-availability violations</text>
<text x="88" y="359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">More files increased workload</text>
<text x="88" y="386" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">The recorded models repaired them</text>
<rect x="578" y="229" width="444" height="241" rx="14" fill="white" stroke="#CFD9E2" stroke-width="1.4"/>
<rect x="578" y="247" width="4" height="205" rx="2" fill="#516477" stroke="#516477" stroke-width="1.4"/>
<text x="602" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#516477" text-anchor="start" letter-spacing="1">SET ASIDE / DESIGN JUDGMENT</text>
<text x="602" y="297" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Ingest under faults</text>
<text x="602" y="332" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Check crash and retry correctness</text>
<text x="602" y="359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Strong deterministic verifier</text>
<text x="602" y="386" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Not piloted; expected a short repair loop</text>
<rect x="1092" y="229" width="444" height="241" rx="14" fill="white" stroke="#CFD9E2" stroke-width="1.4"/>
<rect x="1092" y="247" width="4" height="205" rx="2" fill="#16766F" stroke="#16766F" stroke-width="1.4"/>
<text x="1116" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1">SELECTED / EVALUATED HERE</text>
<text x="1116" y="297" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">Forecasting under uncertainty</text>
<text x="1116" y="332" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Estimate from uneven histories</text>
<text x="1116" y="359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Validate confidence, not just execution</text>
<text x="1116" y="386" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Reusable program on unseen worlds</text>
<rect x="64" y="537" width="1472" height="259" rx="18" fill="#EAF5F2" stroke="#EAF5F2" stroke-width="1.4"/>
<text x="88" y="571" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#16766F" text-anchor="start" letter-spacing="1.1">WHAT MADE THE SELECTED TASK DIFFERENT</text>
<text x="88" y="610" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#172A3A" text-anchor="start" letter-spacing="0">A program can be mechanically correct and still over-trust its data.</text>
<text x="88" y="666" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">That gives the verifier a meaningful quantity to measure and the agent a hypothesis to challenge.</text>
<text x="88" y="721" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">The accepted cost: a harder calibration and fairness argument, with Monte Carlo uncertainty.</text>
<text x="64" y="855" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#516477" text-anchor="start" letter-spacing="0">Earlier candidate histories are described in the notes; their separate trial records are not included here.</text>
</svg>