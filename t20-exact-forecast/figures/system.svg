<text x="750" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#59636d" text-anchor="middle">league/world.py builds a league from one seed: invented players, hidden skills, drifting form, transfers, three seasons</text>
<text x="750" y="369.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#59636d" text-anchor="middle">league/engine.py plays every ball; the truth and every forecaster use this same engine with different skill books</text>
