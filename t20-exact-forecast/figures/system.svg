<text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#59636d" text-anchor="start">A forecasting task graded against the exact truth of a world it owns. The agent sees the left column; it never sees the right.</text>
