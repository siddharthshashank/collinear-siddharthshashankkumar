<text x="750" y="219.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#59636d" text-anchor="middle">295,557 Cricsheet IPL deliveries, parsed, measured and fitted by six scripts under dev/</text>
<text x="750" y="237.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#59636d" text-anchor="middle">Only what repeats in independent halves is kept; the result is one constants file of aggregates</text>
